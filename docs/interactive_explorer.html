<head>

  <style>
    body { margin: 0; background: #f7f8fb; color: #172033; font: 16px system-ui, sans-serif; }

  </style>
</head>

const ids = ["theta", "m", "x"].map(id => document.getElementById(id));
const ctx = document.getElementById("plot").getContext("2d");
let points = [];
function decodeBase64(value) { const bytes = Uint8Array.from(atob(value), c => c.charCodeAt(0)); return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); }
function curve(theta, m, xOffset) { const p = []; const radians = theta * Math.PI / 180; for (let i = 0; i < 1600; i++) { const t = 6 + 54 * i / 1599; const wave = Math.exp(m * Math.abs(t)) * Math.sin(.3 * t); p.push([t * Math.cos(radians) - wave * Math.sin(radians) + xOffset, 42 + t * Math.sin(radians) + wave * Math.cos(radians)]); } return p; }
function render() {
  const theta = +ids[0].value, m = +ids[1].value, xOffset = +ids[2].value;
  document.getElementById("thetaOut").value = theta.toFixed(1) + "°"; document.getElementById("mOut").value = m.toFixed(3); document.getElementById("xOut").value = xOffset.toFixed(1);
  const candidate = curve(theta, m, xOffset), all = points.concat(candidate); let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
  all.forEach(([x,y]) => { xmin=Math.min(xmin,x); xmax=Math.max(xmax,x); ymin=Math.min(ymin,y); ymax=Math.max(ymax,y); });
  const pad = 3, w = ctx.canvas.width, h = ctx.canvas.height, sx = x => 48 + (x - xmin + pad) / (xmax - xmin + 2*pad) * (w - 70), sy = y => h - 36 - (y - ymin + pad) / (ymax - ymin + 2*pad) * (h - 58);
  ctx.clearRect(0,0,w,h); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
  ctx.fillStyle="rgba(37,99,235,.55)"; points.forEach(([x,y]) => { ctx.beginPath(); ctx.arc(sx(x),sy(y),1.6,0,Math.PI*2); ctx.fill(); });
  ctx.strokeStyle="#f97316"; ctx.lineWidth=3; ctx.beginPath(); candidate.forEach(([x,y], i) => i ? ctx.lineTo(sx(x),sy(y)) : ctx.moveTo(sx(x),sy(y))); ctx.stroke();
  ctx.fillStyle="#4b5563"; ctx.fillText("x", w-22, h-18); ctx.fillText("y", 18, 18);
}
ids.forEach(input => input.addEventListener("input", render));
document.getElementById("reset").onclick = () => { ids[0].value=30; ids[1].value=.03; ids[2].value=55; render(); };
decodeBase64(DATA_GZIP_BASE64).then(csv => { points = csv.trim().split(/\r?\n/).slice(1).map(row => row.split(",").map(Number)); render(); }).catch(error => { document.querySelector("p").textContent = "Could not load embedded data: " + error.message; });
